"If I had studied medicine, I would be a doctor now."],

["Advanced Clauses",
"Mệnh đề chỉ nguyên nhân, nhượng bộ, mục đích, kết quả và điều kiện.",
"Although he was tired, he continued working."]

];

let learned = JSON.parse(localStorage.getItem("learnedWords") || "[]");
let totalScore = Number(localStorage.getItem("score") || 0);

function renderTopics(list = topics) {

    const box = document.getElementById("topics");

    box.innerHTML = "";

    list.forEach((topic, index) => {

        const learnedInTopic =
            topic.words.filter(w => learned.includes(w[0])).length;

        const percent =
            Math.round(learnedInTopic / topic.words.length * 100);

        box.innerHTML += `
        <div class="card" onclick="openTopic(${topics.indexOf(topic)})">

            <span class="level">${topic.level}</span>

            <h3>${index + 1}. ${topic.name}</h3>

            <p>${topic.words.length} từ vựng</p>

            <div class="progress">
                <div style="width:${percent}%"></div>
            </div>

            <small>${percent}% đã học</small>

        </div>
        `;
    });
}

function showTopics() {

    document.getElementById("topics").classList.remove("hidden");
    document.getElementById("grammar").classList.add("hidden");

    document.querySelectorAll(".tabs button")[0]
        .classList.add("active");

    document.querySelectorAll(".tabs button")[1]
        .classList.remove("active");
}

function showGrammar() {

    document.getElementById("topics").classList.add("hidden");
    document.getElementById("grammar").classList.remove("hidden");

    document.querySelectorAll(".tabs button")[1]
        .classList.add("active");

    document.querySelectorAll(".tabs button")[0]
        .classList.remove("active");

    const box = document.getElementById("grammar");

    box.innerHTML = grammar.map((g, i) => `
        <div class="grammar-box">

            <h3>${i + 1}. ${g[0]}</h3>

            <p>${g[1]}</p>

            <div class="example">
                <b>Example:</b> ${g[2]}
            </div>

        </div>
    `).join("");
}

function openTopic(index) {

    const topic = topics[index];

    document.getElementById("home").classList.add("hidden");

    const lesson = document.getElementById("lesson");

    lesson.classList.remove("hidden");

    lesson.innerHTML = `

        <button class="back" onclick="closeLesson()">
            ← Quay lại
        </button>

        <div class="lesson">

            <span class="level">${topic.level}</span>

            <h2>${topic.name}</h2>

            <p>Học 10 từ vựng chủ đề này</p>

            ${topic.words.map((w,i)=>`

                <div class="word">

                    <b>${i+1}. ${w[0]}</b>

                    <p>${w[1]}</p>

                    <button class="primary"
                        onclick="learnWord('${w[0]}')">
                        ✓ Đã học
                    </button>

                </div>

            `).join("")}

            <div class="quiz">

                <h2>📝 Mini Quiz</h2>

                ${createQuiz(topic)}

            </div>

        </div>
    `;
}

function createQuiz(topic) {

    const questions = [
        {
            q:`What does "${topic.words[0][0]}" mean?`,
            options:[
                topic.words[0][1],
                "một loại phương tiện",
                "một hoạt động",
                "một địa điểm"
            ],
            answer:0
        },

        {
            q:`Which word means "${topic.words[1][1]}"?`,
            options:[
                topic.words[2][0],
                topic.words[1][0],
                topic.words[3][0],
                topic.words[4][0]
            ],
            answer:1
        },

        {
            q:`Which word belongs to the topic "${topic.name}"?`,
            options:[
                topic.words[5][0],
                "banana",
                "window",
                "pencil"
            ],
            answer:0
        }
    ];

    return questions.map((q,i)=>`

        <div class="question">

            <b>${i+1}. ${q.q}</b>

            ${q.options.map((op,j)=>`

                <button
                    class="option"
                    onclick="answer(this,${j},${q.answer})">

                    ${op}

                </button>

            `).join("")}

        </div>

    `).join("");
}

function answer(button, selected, correct) {

    const buttons = button.parentElement
        .querySelectorAll(".option");

    buttons.forEach(b => b.disabled = true);

    if(selected === correct) {

        button.classList.add("correct");

        totalScore += 10;

    } else {

        button.classList.add("wrong");

        buttons[correct].classList.add("correct");

    }

    localStorage.setItem("score", totalScore);

    updateStats();
}

function learnWord(word) {

    if(!learned.includes(word)) {

        learned.push(word);

        localStorage.setItem(
            "learnedWords",
            JSON.stringify(learned)
        );

        updateStats();

        alert("🎉 Đã thêm vào danh sách từ đã học!");

    } else {

        alert("Bạn đã học từ này rồi!");

    }
}

function closeLesson() {

    document.getElementById("lesson").classList.add("hidden");

    document.getElementById("home").classList.remove("hidden");

    renderTopics();

}

function updateStats() {

    document.getElementById("wordCount").textContent =
        learned.length;

    document.getElementById("score").textContent =
        totalScore;

}

document.getElementById("search").addEventListener("input", e => {

    const value = e.target.value.toLowerCase();

    const filtered = topics.filter(t =>
        t.name.toLowerCase().includes(value)
    );

    renderTopics(filtered);

});

renderTopics();

updateStats();

</script>

</body>
</html>
